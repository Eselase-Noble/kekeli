<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ECG Monitor — is the light on?</title>
    <style>
      :root {
        --bg: #0f1115;
        --card: #1a1e26;
        --text: #e7ecf3;
        --muted: #8b96a8;
        --on: #2ecc71;
        --off: #e74c3c;
        --unknown: #f1c40f;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 20px;
        max-width: 720px;
        margin: 0 auto;
      }
      h1 { font-size: 1.4rem; margin: 0 0 4px; }
      .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 20px; }
      .device {
        background: var(--card);
        border-radius: 14px;
        padding: 18px;
        margin-bottom: 14px;
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .dot {
        width: 18px; height: 18px; border-radius: 50%;
        flex-shrink: 0;
        box-shadow: 0 0 12px currentColor;
      }
      .on { color: var(--on); background: var(--on); }
      .off { color: var(--off); background: var(--off); }
      .unknown { color: var(--unknown); background: var(--unknown); }
      .device .name { font-weight: 600; font-size: 1.05rem; }
      .device .meta { color: var(--muted); font-size: 0.8rem; margin-top: 3px; }
      .badge {
        margin-left: auto; font-weight: 700; text-transform: uppercase;
        font-size: 0.75rem; letter-spacing: 0.5px;
      }
      .events { margin-top: 26px; }
      .events h2 { font-size: 1rem; color: var(--muted); }
      .event {
        font-size: 0.85rem; padding: 8px 0;
        border-bottom: 1px solid #232833;
        display: flex; gap: 10px;
      }
      .event time { color: var(--muted); white-space: nowrap; }
      .empty { color: var(--muted); font-style: italic; }
      footer { margin-top: 30px; color: var(--muted); font-size: 0.75rem; }
    </style>
  </head>
  <body>
    <h1>⚡ ECG Monitor</h1>
    <div class="sub" id="sub">Loading…</div>

    <div id="devices"></div>

    <div class="events">
      <h2>Recent events</h2>
      <div id="events"></div>
    </div>

    <footer id="footer"></footer>

    <script>
      const fmt = (ms) => new Date(ms).toLocaleString();
      const ago = (s) => {
        if (s == null) return "never";
        if (s < 60) return s + "s ago";
        if (s < 3600) return Math.round(s / 60) + " min ago";
        return Math.floor(s / 3600) + "h " + Math.round((s % 3600) / 60) + "m ago";
      };

      async function refresh() {
        try {
          const r = await fetch("/api/status");
          const data = await r.json();
          render(data);
        } catch (e) {
          document.getElementById("sub").textContent = "⚠️ can't reach server";
        }
      }

      function render(data) {
        const anyOff = data.devices.some((d) => d.status === "offline");
        document.getElementById("sub").textContent = data.devices.length
          ? (anyOff ? "⚠️ Something is offline" : "All good — light is on")
          : "No devices yet. Point a device at /api/heartbeat.";

        const dv = document.getElementById("devices");
        dv.innerHTML = "";
        for (const d of data.devices) {
          const el = document.createElement("div");
          el.className = "device";
          const extra = [];
          if (d.battery != null) extra.push("🔋 " + d.battery + "%");
          if (d.balance != null) extra.push("💰 " + d.balance + " units");
          el.innerHTML = `
            <div class="dot ${d.status}"></div>
            <div>
              <div class="name">${d.label || d.id}</div>
              <div class="meta">last seen ${ago(d.silentSeconds)}${
                extra.length ? " · " + extra.join(" · ") : ""
              }</div>
            </div>
            <div class="badge ${d.status}">${d.status}</div>`;
          dv.appendChild(el);
        }

        const ev = document.getElementById("events");
        ev.innerHTML = "";
        if (!data.events.length) {
          ev.innerHTML = '<div class="empty">No events recorded yet.</div>';
        }
        for (const e of data.events) {
          const icon = e.type === "power_off" ? "🔴" : e.type === "power_on" ? "🟢" : "📊";
          const el = document.createElement("div");
          el.className = "event";
          el.innerHTML = `<time>${fmt(e.at)}</time><span>${icon} <b>${e.device_id}</b> — ${
            e.type
          }${e.detail ? " (" + e.detail + ")" : ""}</span>`;
          ev.appendChild(el);
        }

        document.getElementById("footer").textContent =
          `Alerts via: ${data.channels} · offline after ${data.offlineAfterSeconds}s of silence · auto-refreshing`;
      }

      refresh();
      setInterval(refresh, 5000);
    </script>
  </body>
</html>
